<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편의점 단백질 조합기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 휴대폰 앱처럼 가운데 한 줄(최대 480px) + 아래 탭 바 + 밑에서 올라오는 시트.
   찾기 탭은 '목표 카드 → 필터 칩 → 조합 카드' 순서로, 위에서 정하고 아래에서 고른다. */
:root {
  --bg: #eef1ed;
  --surface: #ffffff;
  --surface2: #f5f7f4;
  --fg: #16201a;
  --muted: #5c6962;
  --line: #dde3dd;
  --accent: #1d6b4f;
  --accent-soft: #e0eee7;
  --accent-ink: #ffffff;
  --meal: #2c66a8;
  --snack: #b85c25;
  --carb: #d99a2b;
  --prot: #1d6b4f;
  --fat: #8466c9;
  --warn: #9a6200;
  --warn-soft: #faefd8;
  --bad: #b5372c;
  --bad-soft: #f8e1de;
  --shadow: 0 1px 2px rgba(20, 40, 30, 0.06), 0 4px 14px rgba(20, 40, 30, 0.05);
  --scrim: rgba(10, 20, 15, 0.42);
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411; --surface: #18201b; --surface2: #1f2822; --fg: #e5ece7; --muted: #9babA2; --line: #2b3630;
    --accent: #5cc095; --accent-soft: #1c3329; --accent-ink: #0c1410; --meal: #79a9e3; --snack: #e59a63;
    --carb: #e4b04f; --prot: #5cc095; --fat: #ab93e6; --warn: #e6b450; --warn-soft: #3a2f16; --bad: #ee8a7f; --bad-soft: #3d2320;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #18201b; --surface2: #1f2822; --fg: #e5ece7; --muted: #9babA2; --line: #2b3630;
  --accent: #5cc095; --accent-soft: #1c3329; --accent-ink: #0c1410; --meal: #79a9e3; --snack: #e59a63;
  --carb: #e4b04f; --prot: #5cc095; --fat: #ab93e6; --warn: #e6b450; --warn-soft: #3a2f16; --bad: #ee8a7f; --bad-soft: #3d2320;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상단 바 */
.topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 16px 10px; gap: 12px; }
.topbar h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
.topbar .sub { font-size: 0.75rem; color: var(--muted); }
.brandmark { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; letter-spacing: -0.04em; }

/* 카드 */
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
.stack { display: grid; gap: 12px; }
.section-title { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }

/* 목표 카드 */
.goal { display: grid; gap: 14px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
  font-size: 0.85rem; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .count { font-family: var(--mono); font-size: 0.75rem; background: var(--surface2); color: var(--fg); border-radius: 999px; padding: 0 6px; }
.chip.on .count { background: rgba(255, 255, 255, 0.25); color: inherit; }
.goal .row { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); align-items: center; gap: 10px; }
.goal .row > span:first-child { font-size: 0.9rem; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface2); }
.stepper button { width: 36px; height: 36px; border: 0; background: transparent; font-size: 1.1rem; cursor: pointer; }
.stepper button:active { background: var(--line); }
.stepper input { width: 52px; height: 36px; border: 0; background: transparent; text-align: center; font-family: var(--mono); font-size: 0.95rem; color: var(--fg); }
.stepper.sm button { width: 30px; height: 30px; font-size: 1rem; }
.stepper.sm input { width: 34px; height: 30px; font-size: 0.85rem; }
.unit { font-size: 0.85rem; color: var(--muted); margin-left: 6px; }
.kcal-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kcal-row input { width: 74px; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2);
  text-align: center; font-family: var(--mono); font-size: 0.95rem; color: var(--fg); }
.budget { display: grid; gap: 4px; }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; }
.budget-top b { font-family: var(--mono); font-size: 1.05rem; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.goal .hint { font-size: 0.78rem; color: var(--muted); margin: -6px 0 0; }

/* 필터 줄 */
.filters { margin-top: 14px; }

/* 결과 머리 */
.result-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 22px 0 10px; flex-wrap: wrap; }
.result-head h2 { font-size: 1.05rem; }
.result-head h2 b { color: var(--accent); }
.seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 7px; padding: 6px 4px; font-size: 0.82rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }

/* 조합 카드 */
.combos { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.combo { display: grid; gap: 12px; }
.combo.best { outline: 2px solid var(--accent); outline-offset: -2px; }
.chead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.rankline { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.badge.best { background: var(--accent); color: var(--accent-ink); }
.badge.ev { background: var(--warn-soft); color: var(--warn); }
.badge.warn { background: var(--bad-soft); color: var(--bad); }
.price { font-family: var(--mono); font-size: 1.7rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin-top: 2px; }
.price small { font-size: 0.9rem; font-weight: 500; margin-left: 1px; }
.subline { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.ring { width: 72px; height: 72px; position: relative; }
.ring svg { width: 72px; height: 72px; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring .val b { font-family: var(--mono); font-size: 1rem; }
.ring .val span { font-size: 0.66rem; color: var(--muted); }
.macro { display: grid; gap: 5px; }
.macro .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface2); }
.macro .bar i { display: block; height: 100%; }
.macro .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.75rem; color: var(--muted); }
.macro .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
.items { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 10px;
  border: 0; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.item:hover { background: var(--surface2); }
.tbadge { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 0.68rem; font-weight: 700;
  letter-spacing: -0.04em; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.item .nm { font-size: 0.9rem; font-weight: 500; overflow-wrap: anywhere; }
.item .meta { font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; }
.item .pr { font-family: var(--mono); font-size: 0.9rem; text-align: right; }
.item .alt { font-size: 0.72rem; color: var(--accent); font-weight: 600; }
.pin-mark { font-size: 0.68rem; font-weight: 700; color: var(--accent); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { background: var(--surface2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn svg { width: 16px; height: 16px; flex: none; }
.empty { text-align: center; padding: 28px 20px; display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-size: 1.05rem; }
.empty ul { text-align: left; margin: 0; padding-left: 18px; font-size: 0.88rem; color: var(--muted); display: grid; gap: 4px; }
.notice { font-size: 0.8rem; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: var(--surface2); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.welcome { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--accent-soft); box-shadow: none; }
.welcome p { margin: 0; font-size: 0.88rem; }
.skeleton { height: 220px; border-radius: 16px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface2) 50%, var(--surface) 100%); background-size: 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .skeleton { animation: shimmer 1.2s infinite linear; } @keyframes shimmer { to { background-position: -200% 0; } } }

/* 탭 바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: transparent; padding: 8px 0 10px; display: grid; justify-items: center; gap: 2px; font-size: 0.72rem; color: var(--muted); cursor: pointer; position: relative; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabbar .dot { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 999px; background: var(--bad); color: #fff;
  font-size: 0.65rem; display: grid; place-items: center; padding: 0 4px; font-family: var(--mono); }

/* 시트 */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0;
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 0.18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: 0.6; } } }
.grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 4px auto 2px; }
.sheet h2 { font-size: 1.1rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.x { border: 0; background: var(--surface2); width: 32px; height: 32px; border-radius: 999px; cursor: pointer; font-size: 1rem; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.trow label { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
.trow .cnt { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
.grp-head { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.grp-head b { font-size: 0.95rem; }
.qnote { font-size: 0.75rem; color: var(--muted); }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.field input[type="number"], .field select, .search { height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); color: var(--fg); padding: 0 10px; font: inherit; }
.field input[type="number"] { width: 100px; text-align: right; font-family: var(--mono); }
.search { width: 100%; }
.list { display: grid; gap: 2px; }
.lrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; }
.lrow .nm { font-size: 0.88rem; }
.lrow .meta { font-size: 0.74rem; color: var(--muted); }
.nut { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.nut td { padding: 7px 0; border-bottom: 1px solid var(--line); }
.nut td:last-child { text-align: right; font-family: var(--mono); }
.seg2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 6px; }
.ev-row { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.ev-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ev-top .badge { background: transparent; border: 1px solid; }
.ev-val { font-size: 0.9rem; }
.ev-src a, .linkbtn { color: var(--accent); word-break: keep-all; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
.seg2 button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 4px; cursor: pointer; font-size: 0.85rem; }
.seg2 button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.big-num { font-family: var(--mono); font-size: 2rem; font-weight: 600; color: var(--accent); }

/* 장보기 */
.zone { display: grid; gap: 4px; }
.zone h3 { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-top: 6px; }
.citem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.citem.done .nm { text-decoration: line-through; color: var(--muted); }
.progress { height: 6px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 0.85rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.foot-note { font-size: 0.75rem; color: var(--muted); margin: 18px 0 0; }
</style>
</head>
<body>


<div class="app" id="app">
  <header class="topbar">
    <div class="brandmark"><div class="logo" aria-hidden="true">단백</div>
      <div><h1>편의점 단백질 조합기</h1><div class="sub" id="datatag">CU 상품 불러오는 중…</div></div></div>
  </header>
  <main id="view"></main>
</div>
<div class="tabbar"><nav id="tabs" aria-label="화면">
  <button type="button" data-tab="find" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>찾기</button>
  <button type="button" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>저장<span class="dot" id="dot-saved" hidden></span></button>
  <button type="button" data-tab="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2 11h10l2-8H7.2"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>장보기<span class="dot" id="dot-cart" hidden></span></button>
  <button type="button" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>내 정보</button>
</nav></div>

<script>
// 세 알고리즘 + 추천(체크 밖 추가·조건 완화) — algorithms/*.py 를 그대로 옮긴 것
// 상품 객체: {id, name, price, p(단백질 정수), k(칼로리 정수), pr, kr(원값), type, event, carb, fat, sugar, na, grade}
(function (global) {
  "use strict";
  const INF = Infinity;
  const BIG = 1e8; // 체크 밖 상품 벌점

  const now = () => performance.now();
  const extra = (it) => [it.carb, it.fat, it.sugar, it.na];
  const add4 = (a, it) => [a[0] + it.carb, a[1] + it.fat, a[2] + it.sugar, a[3] + it.na];

  // ---- 선택 조건 ----
  function active(L) {
    return ["carbMin", "carbMax", "fatMax", "sugarMax", "naMax"].some((k) => L[k] != null);
  }
  function uppers(L) {
    return [L.carbMax, L.fatMax, L.sugarMax, L.naMax].map((v) => (v == null ? INF : v));
  }
  function withinUpper(L, s) {
    const u = uppers(L);
    return s.every((v, i) => v <= u[i] + 1e-9);
  }
  function satisfied(L, s) {
    return withinUpper(L, s) && (L.carbMin == null || s[0] >= L.carbMin - 1e-9);
  }
  const NO_LIMITS = {};

  function usable(items, cmax, L) {
    return items.filter((it) => it.k <= cmax && it.price > 0 && withinUpper(L, extra(it)));
  }

  function finish(algo, chosen, t0, t1, kw) {
    const base = Object.assign({ algo, cost: null, items: [], protein: 0, kcal: 0, feasible: false,
      optimal: null, time: t1 - t0, nodes: 0, note: "" }, kw || {});
    if (!chosen) return base;
    base.items = chosen.slice();
    base.cost = chosen.reduce((s, it) => s + it.price, 0);
    base.protein = chosen.reduce((s, it) => s + it.p, 0);
    base.kcal = chosen.reduce((s, it) => s + it.k, 0);
    base.feasible = true;
    return base;
  }

  // ---- Greedy ----
  function greedy(items, R, cmin, cmax, L) {
    L = L || NO_LIMITS;
    const t0 = now();
    items = usable(items, cmax, L);
    const chosen = [], used = new Set();
    let p = 0, k = 0, ex = [0, 0, 0, 0];
    const fits = (it) => k + it.k <= cmax && withinUpper(L, add4(ex, it));
    const take = (it) => { chosen.push(it); used.add(it.id); p += it.p; k += it.k; ex = add4(ex, it); };

    // 1단계: 단백질 1g당 가격 오름차순
    const byP = items.filter((it) => it.p > 0).sort((a, b) => a.price / a.p - b.price / b.p);
    for (const it of byP) {
      if (p >= R) break;
      if (fits(it)) take(it);
    }
    // 2단계: 칼로리(+탄수화물 하한) 채우기, 1kcal당 가격 오름차순
    const short = () => k < cmin || (L.carbMin != null && ex[0] < L.carbMin);
    if (p >= R && short()) {
      const byK = items.filter((it) => !used.has(it.id) && it.k > 0).sort((a, b) => a.price / a.k - b.price / b.k);
      for (const it of byK) {
        if (!short()) break;
        if (fits(it)) take(it);
      }
    }
    const t1 = now();
    if (p >= R && cmin <= k && k <= cmax && satisfied(L, ex)) return finish("Greedy", chosen, t0, t1, { optimal: false });
    return finish("Greedy", null, t0, t1, { optimal: false, note: `해를 못 찾음 (단백질 ${p}g, 칼로리 ${k}kcal에서 멈춤)` });
  }

  // ---- DP ----
  function bsearch(arr, x) {
    let lo = 0, hi = arr.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; }
    return lo < arr.length && arr[lo] === x;
  }

  function dpSolve(items, R, cmin, cmax) {
    const t0 = now();
    items = usable(items, cmax, NO_LIMITS);
    const K = cmax, W = K + 1;
    const dp = [];
    for (let p = 0; p <= R; p++) dp.push(new Float64Array(W).fill(INF));
    dp[0][0] = 0;
    const history = [];
    let updates = 0;
    const Arr = W <= 65536 ? Uint16Array : Uint32Array;

    for (const it of items) {
      const c = it.price, pi = Math.min(it.p, R), ki = it.k, n = W - ki;
      const changed = new Map(); // p(<R) -> 좋아진 칸 j 목록 (k = ki + j)
      const rPrev = new Map();   // R 행 j -> 이전 단백질
      // (1) R 행: 이전 단백질 R-pi ~ R
      const rowR = dp[R];
      const best = rowR.slice(ki);
      for (let pp = Math.max(0, R - pi); pp <= R; pp++) {
        const src = dp[pp];
        for (let j = 0; j < n; j++) {
          const v = src[j] + c;
          if (v < best[j]) { best[j] = v; rPrev.set(j, pp); }
        }
      }
      // (2) p < R 행, 큰 p 부터
      for (let p = R - 1; p >= pi; p--) {
        const row = dp[p];
        const src = pi > 0 ? dp[p - pi] : row.slice();
        const idx = [];
        for (let j = 0; j < n; j++) {
          const v = src[j] + c;
          if (v < row[ki + j]) { row[ki + j] = v; idx.push(j); }
        }
        if (idx.length) { changed.set(p, Arr.from(idx)); updates += idx.length; }
      }
      for (const [j] of rPrev) rowR[ki + j] = best[j];
      updates += rPrev.size;
      history.push([changed, rPrev]);
    }

    const rowR = dp[R];
    let kBest = -1;
    for (let k = cmin; k <= K; k++) if (kBest < 0 || rowR[k] < rowR[kBest]) kBest = k;
    if (kBest < 0 || rowR[kBest] >= INF) return finish("DP", null, t0, now(), { optimal: true, nodes: updates, note: "해 없음" });

    const chosen = [];
    let p = R, k = kBest;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i], [changed, rPrev] = history[i];
      const j = k - it.k;
      if (j < 0) continue;
      if (p === R) {
        if (rPrev.has(j)) { chosen.push(it); p = rPrev.get(j); k = j; }
      } else {
        const arr = changed.get(p);
        if (arr && bsearch(arr, j)) { chosen.push(it); p = p - Math.min(it.p, R); k = j; }
      }
    }
    if (p !== 0 || k !== 0) throw new Error("DP 역추적 실패");
    return finish("DP", chosen.reverse(), t0, now(), { optimal: true, nodes: updates });
  }

  // ---- Branch & Bound ----
  function bnb(items, R, cmin, cmax, L, initial, timeLimitMs, nodeLimit) {
    L = L || NO_LIMITS;
    timeLimitMs = timeLimitMs || 10000;
    nodeLimit = nodeLimit || 50000000;
    const t0 = now();
    items = usable(items, cmax, L);
    const U = uppers(L);
    const carbMin = L.carbMin != null ? L.carbMin : 0;
    const useExtra = active(L);
    const order = items.slice().sort((a, b) => (a.p > 0 ? a.price / a.p : INF) - (b.p > 0 ? b.price / b.p : INF));
    const n = order.length;
    const P = new Float64Array(n + 1), C = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) { P[i + 1] = P[i] + order[i].p; C[i + 1] = C[i] + order[i].price; }
    const sufK = new Float64Array(n + 1), sufRK = new Float64Array(n + 1).fill(INF), sufCarb = new Float64Array(n + 1);
    for (let i = n - 1; i >= 0; i--) {
      const it = order[i];
      sufK[i] = sufK[i + 1] + it.k;
      sufRK[i] = Math.min(sufRK[i + 1], it.k > 0 ? it.price / it.k : INF);
      sufCarb[i] = sufCarb[i + 1] + it.carb;
    }
    function lowerBound(i, cost, p, k, ex) {
      if (ex[0] + sufCarb[i] < carbMin - 1e-9) return INF;
      let lbP = 0;
      const d = R - p;
      if (d > 0) {
        const target = P[i] + d;
        let lo = i + 1, hi = n + 1; // bisect_left(P, target, lo=i+1)
        while (lo < hi) { const m = (lo + hi) >> 1; if (P[m] < target) lo = m + 1; else hi = m; }
        const m = lo;
        if (m > n) return INF;
        const last = order[m - 1];
        lbP = (C[m - 1] - C[i]) + (target - P[m - 1]) * last.price / last.p;
      }
      let lbK = 0;
      const e = cmin - k;
      if (e > 0) {
        if (sufK[i] < e) return INF;
        lbK = e * sufRK[i];
      }
      return cost + Math.max(lbP, lbK);
    }

    let bestCost = INF, bestItems = null;
    if (initial && initial.cost != null) { bestCost = initial.cost; bestItems = initial.items.slice(); }
    const path = [];
    let nodes = 0, stopped = false;
    const STOP = {};

    function dfs(i, cost, p, k, ex) {
      nodes++;
      if (nodes % 20000 === 0 && (nodes >= nodeLimit || now() - t0 > timeLimitMs)) throw STOP;
      if (p >= R && k >= cmin && ex[0] >= carbMin - 1e-9) {
        if (cost < bestCost) { bestCost = cost; bestItems = path.slice(); }
        return;
      }
      if (i === n || lowerBound(i, cost, p, k, ex) >= bestCost) return;
      const it = order[i];
      if (k + it.k <= cmax) {
        let nex = ex, ok = true;
        if (useExtra) {
          nex = add4(ex, it);
          ok = nex.every((s, t) => s <= U[t] + 1e-9);
        }
        if (ok) {
          path.push(it);
          dfs(i + 1, cost + it.price, p + it.p, k + it.k, nex);
          path.pop();
        }
      }
      dfs(i + 1, cost, p, k, ex);
    }
    try { dfs(0, 0, 0, 0, [0, 0, 0, 0]); } catch (e) { if (e === STOP) stopped = true; else throw e; }
    const t1 = now();
    const note = stopped ? `제한 도달 (${t1 - t0 > timeLimitMs ? "시간" : "노드"}) - 최적 보장 안 됨` : "";
    if (!bestItems) return finish("B&B", null, t0, t1, { optimal: !stopped, nodes, note: note || "해 없음" });
    return finish("B&B", bestItems, t0, t1, { optimal: !stopped, nodes, note });
  }

  // ---- B&B 상위 K개: 가격 상한 안의 조합을 최저가 순으로 ----
  // 조합 = 조건(단백질·칼로리·선택 조건)을 만족하고, 어느 상품 하나를 빼도 조건이 깨지는 상품 묶음 (제안).
  //   "최소 조합"만 세는 이유: 조건을 만족하는 조합에 껌 하나를 더 얹어도 조건은 계속 만족하므로,
  //   그런 조합까지 세면 목록이 '같은 조합 + 아무거나 1개'로 채워진다.
  //   칼로리 상한·영양 상한은 빼면 더 잘 지켜지고, 단백질·칼로리 하한은 더하면 더 잘 지켜지므로
  //   "하나씩 빼 보기"만 확인하면 어떤 부분집합도 조건을 만족하지 않는다는 뜻이 된다.
  // 가지치기: 하한 > 가격 상한이면 버림, 목록이 K개 찼으면 하한 >= K번째 가격일 때 버림.
  // Q (선택): {식품 유형: 개수} — 그 유형에서 정확히 그 개수(행 수)만큼 고른 조합만 센다.
  //   수량을 정한 유형의 상품은 빼면 개수가 깨지므로, '최소 조합' 확인은 수량을 안 정한 유형의 상품만 한다.
  //   (수량을 정한 상태에서도 '조건 만족하면 멈춤'이 모든 최소 조합을 찾는다는 성질은 그대로 성립)
  //   하한에는 '모자란 개수 x 남은 그 유형 상품 중 최저가'를 더 넣는다 (세 하한 중 최댓값 사용).
  // 같은 상품(묶음 id g)의 행(1개 / 행사 묶음 등)은 한 조합에 하나만 담는다.
  function bnbTopK(items, R, cmin, cmax, L, cap, K, Q, timeLimitMs, nodeLimit) {
    L = L || NO_LIMITS;
    cap = cap == null ? INF : cap;
    K = K || 20;
    timeLimitMs = timeLimitMs || 10000;
    nodeLimit = nodeLimit || 50000000;
    const t0 = now();
    items = usable(items, cmax, L).filter((it) => it.price <= cap);
    const U = uppers(L);
    const carbMin = L.carbMin != null ? L.carbMin : 0;
    const useExtra = active(L);
    const order = items.slice().sort((a, b) => (a.p > 0 ? a.price / a.p : INF) - (b.p > 0 ? b.price / b.p : INF));
    const n = order.length;
    const P = new Float64Array(n + 1), C = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) { P[i + 1] = P[i] + order[i].p; C[i + 1] = C[i] + order[i].price; }
    const sufK = new Float64Array(n + 1), sufRK = new Float64Array(n + 1).fill(INF), sufCarb = new Float64Array(n + 1);
    for (let i = n - 1; i >= 0; i--) {
      const it = order[i];
      sufK[i] = sufK[i + 1] + it.k;
      sufRK[i] = Math.min(sufRK[i + 1], it.k > 0 ? it.price / it.k : INF);
      sufCarb[i] = sufCarb[i + 1] + it.carb;
    }
    // 수량 조건
    const qTypes = Q ? Object.keys(Q).filter((t) => Q[t] != null) : [];
    const qIdx = new Map(qTypes.map((t, j) => [t, j]));
    const need = qTypes.map((t) => Q[t]);
    const m = qTypes.length;
    const tIdx = order.map((it) => (qIdx.has(it.type) ? qIdx.get(it.type) : -1));
    const sufCnt = [], sufMin = [];
    for (let j = 0; j < m; j++) { sufCnt.push(new Int32Array(n + 1)); sufMin.push(new Float64Array(n + 1).fill(INF)); }
    for (let i = n - 1; i >= 0; i--) {
      for (let j = 0; j < m; j++) {
        const mine = tIdx[i] === j;
        sufCnt[j][i] = sufCnt[j][i + 1] + (mine ? 1 : 0);
        sufMin[j][i] = mine ? Math.min(sufMin[j][i + 1], order[i].price) : sufMin[j][i + 1];
      }
    }
    const cnt = new Int32Array(m);
    const countsDone = () => { for (let j = 0; j < m; j++) if (cnt[j] !== need[j]) return false; return true; };

    function lowerBound(i, cost, p, k, ex) {
      if (ex[0] + sufCarb[i] < carbMin - 1e-9) return INF;
      let lbQ = 0;
      for (let j = 0; j < m; j++) {
        const lack = need[j] - cnt[j];
        if (lack > 0) {
          if (sufCnt[j][i] < lack) return INF;
          lbQ += lack * sufMin[j][i];
        }
      }
      let lbP = 0;
      const d = R - p;
      if (d > 0) {
        const target = P[i] + d;
        let lo = i + 1, hi = n + 1;
        while (lo < hi) { const mid = (lo + hi) >> 1; if (P[mid] < target) lo = mid + 1; else hi = mid; }
        if (lo > n) return INF;
        const last = order[lo - 1];
        lbP = (C[lo - 1] - C[i]) + (target - P[lo - 1]) * last.price / last.p;
      }
      let lbK = 0;
      const e = cmin - k;
      if (e > 0) {
        if (sufK[i] < e) return INF;
        lbK = e * sufRK[i];
      }
      return cost + Math.max(lbP, lbK, lbQ);
    }

    const found = []; // 가격 오름차순, 최대 K개
    const pruneAt = () => (found.length < K ? cap : Math.min(cap, found[K - 1].cost - 1e-9));
    const path = [];
    const usedG = new Set(); // 지금 담은 상품 묶음 id (같은 상품은 한 행만)
    let nodes = 0, stopped = false;
    const STOP = {};
    function minimal(p, k, ex) {
      for (const it of path) {
        if (qIdx.has(it.type)) continue; // 수량을 정한 유형은 빼면 개수가 깨짐
        // 탄수화물 하한이 없으면 ex 가 누적되지 않으므로(useExtra=false) 탄수화물은 확인하지 않음
        if (p - it.p >= R && k - it.k >= cmin && (L.carbMin == null || ex[0] - it.carb >= carbMin - 1e-9)) return false;
      }
      return true;
    }
    // 같은 '모양'(유형·가격 묶음이 같은) 조합은 하나로 친다. 예: 닭가슴살 + 1,200원 라면 A / 라면 B.
    // 모양이 같으면 가격 합도 같으므로, 먼저 찾은 것 하나만 목록에 두고 나머지는 '바꿔 담기'로 보여준다.
    // 받는 개수(u)도 모양에 넣는다: 2+1 상품의 2개·3개처럼 값이 같아도 개수가 다르면 따로 보여준다
    const shapeKey = (its) => its.map((it) => it.type + "|" + it.price + "|" + (it.u || 1)).sort().join("/");
    const seen = new Set();
    function record(cost, p, k) {
      const key = shapeKey(path);
      if (seen.has(key)) return;
      const combo = { cost, items: path.slice(), protein: p, kcal: k, key };
      // 앞에 올 조합: 가격 낮은 것, 같으면 상품 수 적은 것
      let i = found.length;
      while (i > 0 && (found[i - 1].cost > cost || (found[i - 1].cost === cost && found[i - 1].items.length > combo.items.length))) i--;
      found.splice(i, 0, combo);
      seen.add(key);
      if (found.length > K) seen.delete(found.pop().key);
    }
    function dfs(i, cost, p, k, ex) {
      nodes++;
      if (nodes % 20000 === 0 && (nodes >= nodeLimit || now() - t0 > timeLimitMs)) throw STOP;
      const core = p >= R && k >= cmin && ex[0] >= carbMin - 1e-9;
      if (core && countsDone()) {
        // 더 담으면 같은 조합 + 군더더기가 되므로 여기서 멈춤
        if (cost <= pruneAt() && minimal(p, k, ex)) record(cost, p, k);
        return;
      }
      if (i === n || lowerBound(i, cost, p, k, ex) > pruneAt()) return;
      const it = order[i], j = tIdx[i];
      // 넣을 수 있는지: 칼로리 상한, 수량을 정한 유형이면 개수가 남았는지,
      // 단백질·칼로리는 이미 채웠고 개수만 모자라면 수량 정한 유형만 (다른 걸 넣으면 군더더기)
      // 같은 상품(묶음 id g)의 다른 행(1개 / 행사 묶음)이 이미 담겼으면 못 넣음
      const canAdd = k + it.k <= cmax && (j < 0 ? !core : cnt[j] < need[j]) && !(it.g && usedG.has(it.g));
      if (canAdd) {
        let nex = ex, ok = true;
        if (useExtra) {
          nex = add4(ex, it);
          ok = nex.every((s, t) => s <= U[t] + 1e-9);
        }
        if (ok) {
          path.push(it);
          if (j >= 0) cnt[j]++;
          if (it.g) usedG.add(it.g);
          dfs(i + 1, cost + it.price, p + it.p, k + it.k, nex);
          if (it.g) usedG.delete(it.g);
          if (j >= 0) cnt[j]--;
          path.pop();
        }
      }
      dfs(i + 1, cost, p, k, ex);
    }
    try { dfs(0, 0, 0, 0, [0, 0, 0, 0]); } catch (e) { if (e === STOP) stopped = true; else throw e; }
    const t1 = now();
    return { combos: found, nodes, time: t1 - t0, stopped, candidates: n,
      note: stopped ? `탐색 제한 도달 (${t1 - t0 > timeLimitMs ? "시간" : "노드"}) - 순위가 정확하지 않을 수 있어요` : "" };
  }

  // 조합의 상품 하나를 '같은 유형·같은 가격'의 다른 상품으로 바꿔도 조건을 지키는 후보들.
  // 같은 가격이라도 단백질·칼로리가 달라서 바꾸면 조건이 깨질 수 있으므로 하나씩 확인한다.
  // 확인하는 것: 단백질 하한, 칼로리 범위, 선택 조건, 최소 조합(군더더기 없음). 같은 유형끼리라 개수 조건은 그대로.
  // pinned: 사용자가 '꼭 넣기'한 상품 id — 바꿔 담기 후보를 만들지 않고, 빼 볼 대상도 아니다.
  function addAlternatives(combo, cand, R, cmin, cmax, L, Q, pinned) {
    pinned = pinned || new Set();
    const inCombo = new Set(combo.items.map((it) => it.id));
    const qset = new Set(Q ? Object.keys(Q).filter((t) => Q[t] != null) : []);
    const ok = (its) => {
      let p = 0, k = 0, ex = [0, 0, 0, 0];
      for (const it of its) { p += it.p; k += it.k; ex = add4(ex, it); }
      if (p < R || k < cmin || k > cmax || !satisfied(L, ex)) return false;
      for (const it of its) {
        if (qset.has(it.type) || pinned.has(it.id)) continue;
        if (p - it.p >= R && k - it.k >= cmin && (L.carbMin == null || ex[0] - it.carb >= L.carbMin - 1e-9)) return false;
      }
      return true;
    };
    // 같은 상품의 다른 행(1개 / 행사 묶음)이 조합에 이미 있으면 바꿔 담기 후보가 아님
    const groupsBut = (idx) => new Set(combo.items.filter((x, j) => j !== idx && x.g).map((x) => x.g));
    combo.alts = combo.items.map((it, idx) => (pinned.has(it.id) ? [] :
      cand.filter((c) => c.type === it.type && c.price === it.price && (c.u || 1) === (it.u || 1) && !inCombo.has(c.id) &&
        !(c.g && groupsBut(idx).has(c.g)) &&
        ok(combo.items.map((x, j) => (j === idx ? c : x))))));
    return combo;
  }

  // 가격 상한·종류 체크를 반영한 상위 K개 + 없을 때 이유
  // opts.pinned  : 꼭 넣을 상품 id 목록 (종류 체크와 상관없이 들어감)
  // opts.excluded: 빼 둘 상품 id 목록
  // opts.timeLimitMs: B&B 시간 제한
  // 꼭 넣을 상품은 미리 담아 두고, 남은 조건(단백질·칼로리·예산·선택 조건·개수)만큼만 나머지에서 찾는다.
  function listCombos(items, types, R, cmin, cmax, L, cap, K, Q, opts) {
    opts = opts || {};
    L = L || NO_LIMITS;
    Q = Q || {};
    const allTypes = new Set(items.map((it) => it.type));
    const checked = new Set(types && types.length ? types : allTypes);
    const excluded = new Set(opts.excluded || []);
    const pinnedIds = new Set((opts.pinned || []).filter((id) => !excluded.has(id)));
    const pinned = items.filter((it) => pinnedIds.has(it.id));
    // 꼭 넣은 상품과 같은 상품의 다른 행(1개 / 행사 묶음)은 후보에서 뺀다 (같은 상품은 한 행만)
    const pinnedG = new Set(pinned.filter((it) => it.g).map((it) => it.g));
    const pool = items.filter((it) => checked.has(it.type) && !excluded.has(it.id) && !pinnedIds.has(it.id) && !(it.g && pinnedG.has(it.g)));
    const res = { combos: [], nodes: 0, time: 0, stopped: false, note: "", pool: pool.length, reasons: [], pinned };

    // 꼭 넣을 상품을 뺀 남은 조건
    const s = (f) => pinned.reduce((a, it) => a + it[f], 0);
    const pP = s("p"), pK = s("k"), pC = s("price");
    const pEx = [s("carb"), s("fat"), s("sugar"), s("na")];
    const R2 = Math.max(0, R - pP), cmin2 = cmin - pK, cmax2 = cmax - pK;
    const cap2 = cap == null ? null : cap - pC;
    const sub = (v, x) => (v == null ? null : v - x);
    const L2 = { carbMin: L.carbMin == null || L.carbMin - pEx[0] <= 0 ? null : L.carbMin - pEx[0],
      carbMax: sub(L.carbMax, pEx[0]), fatMax: sub(L.fatMax, pEx[1]), sugarMax: sub(L.sugarMax, pEx[2]), naMax: sub(L.naMax, pEx[3]) };
    const Q2 = {};
    let qBroken = "";
    for (const t of Object.keys(Q)) {
      if (Q[t] == null) continue;
      const have = pinned.filter((it) => it.type === t).length;
      if (have > Q[t]) qBroken = `꼭 넣을 상품 중 ${t}가 ${have}개라 개수 ${Q[t]}개를 넘어요.`;
      Q2[t] = Q[t] - have;
    }
    if (pinned.length) {
      const over = [];
      if (cmax2 < 0) over.push(`칼로리 상한(${cmax}kcal)`);
      if (cap2 != null && cap2 < 0) over.push(`예산(${cap.toLocaleString()}원)`);
      [["carbMax", "탄수화물 상한"], ["fatMax", "지방 상한"], ["sugarMax", "당류 상한"], ["naMax", "나트륨 상한"]]
        .forEach(([k, lb]) => { if (L2[k] != null && L2[k] < -1e-9) over.push(lb); });
      if (over.length || qBroken) {
        if (over.length) res.reasons.push(`꼭 넣을 상품만으로 ${over.join(", ")}을 넘어요.`);
        if (qBroken) res.reasons.push(qBroken);
        return res;
      }
    }

    const run = bnbTopK(pool, R2, cmin2, cmax2, L2, cap2, K, Q2, opts.timeLimitMs);
    Object.assign(res, { nodes: run.nodes, time: run.time, stopped: run.stopped, note: run.note });
    res.combos = run.combos.map((c) => ({
      cost: c.cost + pC, key: c.key, items: pinned.concat(c.items),
      protein: c.protein + pP, kcal: c.kcal + pK,
    }));
    const cand = usable(pool, cmax, L).filter((it) => cap == null || it.price <= cap);
    res.combos.forEach((c) => addAlternatives(c, cand, R, cmin, cmax, L, Q, pinnedIds));
    if (res.combos.length) return res;

    // 없을 때 이유
    const hasQ = Object.keys(Q2).length > 0;
    if (hasQ) {
      const c2 = usable(pool, cmax2, L2).filter((it) => cap2 == null || it.price <= cap2);
      for (const t of Object.keys(Q2)) {
        const c = c2.filter((it) => it.type === t).length;
        if (c < Q2[t]) res.reasons.push(`${t}에서 쓸 수 있는 상품이 ${c}개뿐이라 ${Q2[t]}개를 더 고를 수 없어요.`);
      }
      const free = bnbTopK(pool, R2, cmin2, cmax2, L2, cap2, 1, null, opts.timeLimitMs);
      res.nodes += free.nodes; res.time += free.time;
      if (free.combos.length) {
        res.reasons.push(`개수 조건을 빼면 ${(free.combos[0].cost + pC).toLocaleString()}원 조합이 있어요. 정한 개수로는 단백질·칼로리·예산을 함께 맞출 수 없어요.`);
        return res;
      }
      if (res.reasons.length) return res;
    }
    if (cap2 != null) {
      const best = bnbTopK(pool, R2, cmin2, cmax2, L2, null, 1, Q2, opts.timeLimitMs);
      res.nodes += best.nodes; res.time += best.time;
      if (best.combos.length) {
        res.cheapest = best.combos[0].cost + pC;
        res.reasons.push(`예산을 빼면 가장 싼 조합이 ${res.cheapest.toLocaleString()}원이라, ${cap.toLocaleString()}원 안에는 조합이 없어요.`);
        return res;
      }
    }
    res.reasons = res.reasons.concat(diagnose(pool, R2, cmin2, cmax2, L2));
    if (pinned.length) res.reasons.push("꼭 넣을 상품을 빼면 조합이 생길 수 있어요.");
    return res;
  }

  // ---- 추천 (planner.py) ----
  function solve(items, R, cmin, cmax, L, algo) {
    if (algo === "greedy") return [greedy(items, R, cmin, cmax, L), ""];
    let note = "";
    if (algo === "dp") {
      if (!active(L)) return [dpSolve(items, R, cmin, cmax), ""];
      note = "선택 조건이 있어 DP 대신 B&B로 계산했어요. (DP는 영양성분마다 표 차원이 하나씩 늘어나서 지원하지 않음)";
    }
    const g = greedy(items, R, cmin, cmax, L);
    const r = bnb(items, R, cmin, cmax, L, g);
    r.time += g.time; // 초기해(Greedy) 시간 포함
    if (algo === "dp") r.algo = "B&B (DP 대신)";
    return [r, note];
  }

  function diagnose(pool, R, cmin, cmax, L) {
    if (!pool.length) return ["체크한 유형에 해당하는 상품이 없어요."];
    const msgs = [];
    const cand = usable(pool, cmax, L);
    if (cand.length < pool.length)
      msgs.push(`${pool.length - cand.length}개 상품은 1개만으로도 칼로리 상한${active(L) ? "이나 선택 조건" : ""}을 넘어서 쓸 수 없어요.`);
    if (!cand.length) return msgs.concat(["남는 상품이 없어요."]);
    const totP = cand.reduce((s, it) => s + it.p, 0);
    const totK = cand.reduce((s, it) => s + it.k, 0);
    if (totP < R) msgs.push(`쓸 수 있는 상품을 전부 사도 단백질이 ${totP}g이라 ${R}g을 못 채워요.`);
    if (totK < cmin) msgs.push(`쓸 수 있는 상품을 전부 사도 칼로리가 ${totK}kcal이라 ${cmin}kcal을 못 채워요.`);
    if (L.carbMin != null && cand.reduce((s, it) => s + it.carb, 0) < L.carbMin) msgs.push(`전부 사도 탄수화물이 ${L.carbMin}g에 못 미쳐요.`);
    if (totP >= R) {
      let need = R, kcal = 0;
      const sorted = cand.filter((x) => x.p > 0).sort((a, b) => a.k / a.p - b.k / b.p);
      for (const it of sorted) {
        const t = Math.min(1, need / it.p);
        kcal += t * it.k; need -= t * it.p;
        if (need <= 0) break;
      }
      if (kcal > cmax) msgs.push(`단백질 ${R}g을 채우려면 칼로리가 최소 약 ${Math.round(kcal)}kcal 필요해서 상한 ${cmax}kcal을 넘어요.`);
    }
    if (!msgs.some((m) => !m.includes("쓸 수 없어요")))
      msgs.push("남은 상품으로는 단백질·칼로리·선택 조건을 동시에 맞추는 조합이 없어요 (하나를 맞추면 다른 조건을 넘어요).");
    return msgs;
  }

  function actual(res, original) {
    if (res.cost == null) return res;
    const chosen = res.items.map((it) => original.get(it.id));
    return Object.assign({}, res, { items: chosen, cost: chosen.reduce((s, it) => s + it.price, 0) });
  }

  const LIMIT_NAMES = [["carbMin", "탄수화물 하한"], ["carbMax", "탄수화물 상한"], ["fatMax", "지방 상한"],
    ["sugarMax", "당류 상한"], ["naMax", "나트륨 상한"]];

  function recommend(items, types, R, cmin, cmax, L, algo) {
    const allTypes = new Set(items.map((it) => it.type));
    const checked = new Set(types && types.length ? types : allTypes);
    const whole = [...allTypes].every((t) => checked.has(t));
    const pool = items.filter((it) => checked.has(it.type));
    const rec = { status: "none", result: null, added: [], messages: [], alternatives: [], reasons: [] };

    let [res, note] = solve(pool, R, cmin, cmax, L, algo);
    if (note) rec.messages.push(note);
    if (res.cost != null) {
      rec.status = "ok"; rec.result = res;
      rec.messages.push(whole ? "전체 상품 중 최저가 조합이에요." : "체크한 유형 안에서 찾은 조합이에요.");
      return rec;
    }
    rec.lastTry = res;
    rec.messages.push((whole ? "전체 상품으로도" : "체크한 유형만으로는") + " 조건을 만족하는 조합이 없어요.");
    rec.reasonsAt = rec.messages.length; // 이유 목록을 이 메시지 바로 뒤에 보여줌
    if (algo === "greedy" && pool.length) rec.reasons.push("Greedy는 해가 있어도 못 찾을 수 있어요. " + (res.note || ""));
    rec.reasons = rec.reasons.concat(diagnose(pool, R, cmin, cmax, L));

    const original = new Map(items.map((it) => [it.id, it]));
    const penalized = items.map((it) => (checked.has(it.type) ? it : Object.assign({}, it, { price: it.price + BIG })));
    if (!whole) {
      const [r2] = solve(penalized, R, cmin, cmax, L, algo);
      if (r2.cost != null) {
        const r = actual(r2, original);
        rec.status = "expanded"; rec.result = r;
        rec.added = r.items.filter((it) => !checked.has(it.type));
        const kinds = [...new Set(rec.added.map((it) => it.type))].sort();
        rec.messages.push(`그래서 체크하지 않은 유형(${kinds.join(", ")})에서 ${rec.added.length}개를 추가했어요. 추가 개수를 가장 적게 하고, 그중 가장 싼 조합이에요.`);
        if (rec.added.length === r.items.length) rec.messages.push("체크한 유형의 상품은 이 조합에 들어가지 못했어요.");
        return rec;
      }
    }
    if (active(L)) {
      const options = [];
      for (const [key, label] of LIMIT_NAMES) {
        if (L[key] == null) continue;
        const relaxed = Object.assign({}, L, { [key]: null });
        const [r3] = solve(penalized, R, cmin, cmax, relaxed, algo);
        if (r3.cost != null) options.push([actual(r3, original), label]);
      }
      if (options.length) {
        options.sort((a, b) => a[0].cost - b[0].cost);
        const [best, label] = options[0];
        rec.status = "relaxed"; rec.result = best;
        rec.added = best.items.filter((it) => !checked.has(it.type));
        rec.messages.push(`상품을 추가해도 안 돼서 '${label}' 조건을 빼고 찾았어요.`);
        if (rec.added.length) rec.messages.push(`체크하지 않은 유형에서 ${rec.added.length}개도 추가됐어요.`);
        rec.alternatives = options.slice(1).map(([r, lb]) => `'${lb}' 조건을 빼면 ${r.cost.toLocaleString()}원 조합이 가능해요.`);
        return rec;
      }
    }
    if (!whole) {
      rec.messages.push("전체 상품으로 넓혀도 조합이 없어요.");
      rec.reasons = rec.reasons.concat(diagnose(items, R, cmin, cmax, L));
    }
    rec.messages.push("단백질 기준을 낮추거나 칼로리 범위를 넓혀 보세요.");
    return rec;
  }

  global.Algo = { greedy, dpSolve, bnb, bnbTopK, listCombos, addAlternatives, usable, recommend, active };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
"use strict";
// ================= 상수 =================
const GROUPS = [
  { name: "식사", color: "var(--meal)", types: ["도시락", "김밥·삼각김밥", "샌드위치·햄버거", "샐러드", "라면·면·떡볶이", "밥·죽", "닭가슴살·육가공", "계란·두부", "참치·수산"] },
  { name: "간식·음료", color: "var(--snack)", types: ["과자·빵", "아이스크림", "견과·안주", "우유·두유·요거트", "단백질음료·식품", "기타음료", "기타식품"] },
];
const ALL_TYPES = GROUPS.flatMap((g) => g.types);
const SHORT = { "도시락": "도시락", "김밥·삼각김밥": "김밥", "샌드위치·햄버거": "샌드", "샐러드": "샐러드", "라면·면·떡볶이": "라면",
  "밥·죽": "밥·죽", "닭가슴살·육가공": "닭·햄", "계란·두부": "계란", "참치·수산": "참치", "과자·빵": "과자", "아이스크림": "아이스",
  "견과·안주": "견과", "우유·두유·요거트": "우유", "단백질음료·식품": "프로틴", "기타음료": "음료", "기타식품": "기타" };
const GROUP_OF = {}; GROUPS.forEach((g) => g.types.forEach((t) => (GROUP_OF[t] = g)));
// 장보기 구역: CU 홈페이지의 상품 분류 그대로 (근거: 수집한 CU 상품 목록의 분류값)
const ZONES = ["간편식사", "식품", "음료", "과자류", "아이스크림"];

// ---- 근거가 있는 기준값 (출처는 아래 SRC, 화면의 '근거 보기'와 docs/기준값_근거.md 에 정리) ----
const SRC = {
  iom: { name: "미국 IOM 에너지 필요추정량 식 (2002, 한국인 영양소 섭취기준이 2005년부터 사용)", url: "https://koreascience.kr/article/JAKO202108360693676.page?lang=ko" },
  iomEq: { name: "IOM 성인 에너지 필요추정량 식과 신체활동 계수 (통계청 캐나다 재수록)", url: "https://www150.statcan.gc.ca/n1/pub/82-003-x/2008004/article/10703/t/5800493-eng.htm" },
  kdriP: { name: "2020 한국인 영양소 섭취기준 단백질 권장섭취량 0.91g/kg (한국영양학회지 해설)", url: "https://www.koreascience.or.kr/article/JAKO202210242857035.page" },
  kdri25: { name: "보건복지부 보도자료: 2025 한국인 영양소 섭취기준 개정 (2025-12-31)", url: "https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1488441&tag=&nPage=1" },
  issn: { name: "ISSN 입장문: 단백질과 운동 (Jäger 외, 2017) — 하루 1.4~2.0g/kg, 1회 0.25g/kg", url: "https://pubmed.ncbi.nlm.nih.gov/28642676/" },
  hector: { name: "Hector & Phillips (2018) 체중 감량 중 단백질 1.6~2.4g/kg", url: "https://pubmed.ncbi.nlm.nih.gov/29182451/" },
  murphy: { name: "Murphy, Hector & Phillips (2015) 감량 시 하루 약 500kcal 적자", url: "https://pubmed.ncbi.nlm.nih.gov/25014731/" },
  who2000: { name: "WHO 당류 지침 (2015): 하루 2,000kcal 성인을 예로 듦", url: "https://who.int/news/item/04-03-2015-who-calls-on-countries-to-reduce-sugars-intake-among-adults-and-children" },
  cu: { name: "CU 홈페이지 상품 목록 (가격·행사 표시·분류)", url: "https://cu.bgfretail.com/product/product.do?category=product" },
};
const PA = { m: { sed: 1.0, low: 1.11, act: 1.25, very: 1.48 }, f: { sed: 1.0, low: 1.12, act: 1.27, very: 1.45 } };
const ACT = { sed: ["비활동적", "거의 앉아서 생활"], low: ["저활동적", "가벼운 활동 (한국인 평균 수준)"], act: ["활동적", "주 3~5회 운동"], very: ["매우 활동적", "거의 매일 강도 높은 운동"] };
const GOALS = {
  gain: { name: "근육 늘리기", f: 1.4, deficit: 0, why: "ISSN 권장 범위 하루 1.4~2.0g/kg의 하한", src: ["issn"] },
  keep: { name: "건강 유지", f: 0.91, deficit: 0, why: "한국인 영양소 섭취기준 권장섭취량 0.91g/kg", src: ["kdriP"] },
  lose: { name: "체중 줄이기", f: 1.6, deficit: 500, why: "감량 중 권장 범위 1.6~2.4g/kg의 하한, 칼로리는 하루 500kcal 적게", src: ["hector", "murphy"] },
};
const DOSE_PER_KG = 0.25;   // ISSN 1회 단백질 0.25g/kg
const GRADE_TEXT = { "A": "제품명·용량까지 일치", "B": "제품명 일치, 용량은 추정", "B-": "비슷한 제품명으로 매칭 (오차 가능)" };
const PAGE = 20, MAX_SHOWN = 200; // 처음 20개, 아래로 내리면 20개씩 더 (최대 200개)
let SHOWN = PAGE;

// ================= 상태 =================
// 단백질 목표(R)는 기본값 없이 비워 둔다: 내 정보로 계산하거나 직접 넣는다.
// 칼로리 최대(b)는 비워 두면 상관없음(null).
const DEF = { R: null, b: null, noDefR: true, cap: 10000, types: ALL_TYPES.slice(), Q: {}, L: {},
  pinned: [], excluded: [],
  profile: { sex: null, age: null, height: null, weight: null, act: "low", goal: "gain", meals: 3 }, saved: [], cart: [], welcomed: false };
let S = load();
let ITEMS = [], BY_ID = new Map(), META = {};
let RES = null, CTX = null, TAB = "find";
const $ = (id) => document.getElementById(id);
const won = (n) => Math.round(n).toLocaleString("ko-KR");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const g1 = (x) => (Math.round(x * 10) / 10).toString();

function load() {
  try {
    const v = JSON.parse(localStorage.getItem("pcombo.v1") || "null");
    if (v) {
      // 예전 버전(칼로리 최소 a가 있던 때)의 칼로리 범위는 버리고 '상관없음'으로
      if ("a" in v) { delete v.a; v.b = null; delete v.lowSugar; delete v.lowNa; delete v.tol; }
      // 예전 기본값 34g(근거가 약해 없앰)이 그대로 남아 있으면 비운다
      if (!v.noDefR) { if (v.R === 34 || v.R === 40) v.R = null; v.noDefR = true; }
      return Object.assign({}, DEF, v, { profile: Object.assign({}, DEF.profile, v.profile || {}) });
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEF));
}
function save() { try { localStorage.setItem("pcombo.v1", JSON.stringify(S)); } catch (e) {} }

function toast(msg) {
  const r = $("toast-root");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (r.innerHTML = ""), 2200);
}
function tbadge(type) { return `<span class="tbadge" style="--c:${GROUP_OF[type] ? GROUP_OF[type].color : "var(--muted)"}" aria-hidden="true">${esc(SHORT[type] || type)}</span>`; }
function evText(ev) { return ev === "1+1" ? "1+1 행사: 2개를 1개 값에" : ev === "2+1" ? "2+1 행사: 3개를 2개 값에" : ""; }
// 행사 상품을 적게 사는 행의 안내
function promoText(it) {
  if (it.promo === "1+1") return "1+1 행사 상품을 1개만 담았어요. 같은 값에 1개를 더 받을 수 있어요.";
  if (it.promo === "2+1") return `2+1 행사 상품을 ${it.u}개만 담았어요. ${it.u === 2 ? "같은 값에 1개를 더 받을 수 있어요." : "2개 값을 내면 3개를 받아요."}`;
  return "";
}
function evBadge(it) { return it.event ? `<span class="badge ev">${esc(it.event)}</span>` : it.promo ? `<span class="badge">${esc(it.promo)} 중 ${it.u}개</span>` : ""; }
// 상품 수 (행사 상품의 1개 행·묶음 행은 한 상품)
function productCount() { return new Set(ITEMS.map((x) => x.g || x.id)).size; }
// 같은 상품의 모든 행 id (1개 행 + 행사 묶음 행)
function groupIds(id) { const it = BY_ID.get(id); return it && it.g ? ITEMS.filter((x) => x.g === it.g).map((x) => x.id) : [id]; }
// 내 정보 → 하루 칼로리(IOM 식), 하루 단백질, 한 끼 목표
function profileOk(p) { return p.sex && p.age >= 19 && p.age <= 100 && p.height >= 120 && p.height <= 220 && p.weight >= 30 && p.weight <= 200; }
function eer(p) {
  const H = p.height / 100, pa = PA[p.sex][p.act];
  return p.sex === "m" ? 662 - 9.53 * p.age + pa * (15.91 * p.weight + 539.6 * H)
                       : 354 - 6.91 * p.age + pa * (9.36 * p.weight + 726 * H);
}
function plan(goalKey) {
  const p = S.profile, ok = profileOk(p);
  const g = GOALS[goalKey || p.goal];
  const meals = p.meals || 3;
  if (!ok) return { ok: false, meals };
  const base = eer(p), dayKcal = base - g.deficit, dayP = p.weight * g.f;
  const mealK = dayKcal / meals;
  // 칼로리 최대는 체중 줄이기에만 건다 (감량 = 칼로리 적자). 나머지 목표는 상관없음.
  return { ok: true, g, meals, base, dayKcal, dayP, R: Math.ceil(dayP / meals), mealK,

function openSheet(kind, arg) {
  const root = $("sheet-root");
  let body = "";
  if (kind === "types") body = sheetTypes();
  else if (kind === "nutri") body = sheetNutri();
  else if (kind === "pin") body = sheetPin();
  else if (kind === "excluded") body = sheetExcluded();
  else if (kind === "item") body = sheetItem(arg);
  else if (kind === "evidence") body = sheetEvidence();
  root.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" data-kind="${kind}"><div class="grab"></div>${body}</div></div>`;
  root.dataset.kind = kind; root.dataset.arg = arg ? JSON.stringify(arg) : "";
  const f = root.querySelector("[autofocus]"); if (f) f.focus();
}
function refreshSheet() { const r = $("sheet-root"); if (r.innerHTML) { const k = r.dataset.kind, a = r.dataset.arg ? JSON.parse(r.dataset.arg) : null; openSheet(k, a); } }
function closeSheet() { $("sheet-root").innerHTML = ""; }
function head(title) { return `<div class="sheet-head"><h2>${title}</h2><button class="x" data-act="close-sheet" aria-label="닫기">✕</button></div>`; }
function countOf(t) { return ITEMS.filter((it) => it.type === t).length; }
function sheetTypes() {

      ${g.types.map((t) => {

        return `<div class="trow"><label><input type="checkbox" data-type="${esc(t)}" ${S.types.includes(t) ? "checked" : ""}>${tbadge(t)}<span>${esc(t)} <span class="cnt">${countOf(t)}</span></span></label>
          <div class="stepper sm"><button type="button" data-q="${esc(t)}" data-d="-1" aria-label="${esc(t)} 개수 줄이기">−</button><input readonly value="${q == null ? "–" : q}" aria-label="${esc(t)} 개수"><button type="button" data-q="${esc(t)}" data-d="1" aria-label="${esc(t)} 개수 늘리기">+</button></div></div>`;

function pinSearch(q) {

    $("sheet-root").innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${head("복사할 내용")}
      <textarea class="search" style="height:180px;padding:10px" readonly id="copy-ta">${esc(text)}</textarea><p class="qnote">길게 눌러 복사하세요.</p></div></div>`;
    const ta = $("copy-ta"); ta.focus(); ta.select();
  }
}

// ================= 화면 전환 =================
function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === TAB ? "page" : "false"));
  const v = $("view");
  if (TAB === "find") { v.innerHTML = viewFind(); renderResults(); }
  else if (TAB === "saved") v.innerHTML = viewSaved();
  else if (TAB === "cart") v.innerHTML = viewCart();
  else v.innerHTML = viewMe();
  const ds = $("dot-saved"), dc = $("dot-cart");
  ds.hidden = !S.saved.length; ds.textContent = S.saved.length;
  const left = S.cart.filter((x) => !x.done).length;
  dc.hidden = !left; dc.textContent = left;
}
function go(tab) { TAB = tab; render(); window.scrollTo(0, 0); }
function comboFrom(ci, sid) {
  if (sid) { const x = S.saved.find((s) => String(s.at) === String(sid)); return x ? { cost: x.cost, items: x.items } : null; }
  return RES && RES.combos ? RES.combos[ci] : null;
}

// ================= 이벤트 =================
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-act], .scrim");
  if (!t) return;
  const d = t.dataset;
  if (t.classList.contains("scrim") && e.target !== t) return; // 시트 안쪽 클릭
  if (d.tab) return go(d.tab);
  if (d.go) { closeSheet(); return go(d.go); }
  if (d.preset) {
    const p = presetList().find((x) => x.id === d.preset); if (!p) return;
    if (GOALS[d.preset]) S.profile.goal = d.preset;
    Object.assign(S, { R: p.R, b: p.b }); return render(), compute();
  }
  if (d.pf) {
    const k = d.pf, v = d.v;
    S.profile[k] = k === "meals" ? Number(v) : v;
    save(); return render();
  }
  if (d.step) { S[d.step] = Math.max(5, (S[d.step] || 0) + Number(d.d)); $("in-" + d.step).value = S[d.step]; syncPresets(); return schedule(); }
  if (d.toggle) { S[d.toggle] = !S[d.toggle]; return compute(); }
  if (d.sheet) return openSheet(d.sheet);
  if (d.item) return openSheet("item", { id: d.item, ci: d.ci === "" ? null : Number(d.ci), slot: Number(d.slot), snap: findSnap(d.item) });
  if (d.q) {
    const cur = S.Q[d.q], n = cur == null ? (Number(d.d) > 0 ? 1 : null) : cur + Number(d.d);
    S.Q[d.q] = n == null || n < 1 ? null : Math.min(n, 10);
    if (S.Q[d.q] != null && !S.types.includes(d.q)) S.types.push(d.q);
    refreshSheet(); return compute();
  }
  if (d.tset) {
    if (d.tset === "all") S.types = ALL_TYPES.slice();
    else if (d.tset === "meal") S.types = GROUPS[0].types.slice();
    else if (d.tset === "snack") S.types = GROUPS[1].types.slice();
    else S.Q = {};
    refreshSheet(); return compute();
  }
  if (d.pin) { // 같은 상품은 한 행만: 1개 행과 행사 묶음 행 중 고른 것만 남긴다
    const ids = groupIds(d.pin);
    S.pinned = S.pinned.filter((x) => !ids.includes(x)).concat(d.pin); S.excluded = S.excluded.filter((x) => !ids.includes(x)); toast("꼭 넣을 상품에 넣었어요"); refreshPin(); return compute(); }
  if (d.unpin) { S.pinned = S.pinned.filter((x) => x !== d.unpin); refreshPin(); return compute(); }
  if (d.exclude) { // 같은 상품의 1개 행·행사 묶음 행을 함께 뺀다
    const ids = groupIds(d.exclude);
    S.excluded = [...new Set(S.excluded.concat(ids))]; S.pinned = S.pinned.filter((x) => !ids.includes(x)); closeSheet(); toast("이 상품은 이제 안 나와요. 내 정보에서 되살릴 수 있어요"); compute(); return TAB === "find" ? null : render(); }
  if (d.unexclude) { const ids = groupIds(d.unexclude); S.excluded = S.excluded.filter((x) => !ids.includes(x)); refreshSheet(); compute(); return TAB === "me" ? render() : null; }
  if (d.swap) {
    const c = RES.combos[Number(d.ci)], slot = Number(d.slot), nw = BY_ID.get(d.swap);
    c.items = c.items.slice(); c.items[slot] = nw;
    Algo.addAlternatives(c, CTX_cand(), S.R, 0, kmax(), CTX.L, CTX.Q, new Set(S.pinned));
    closeSheet(); renderResults(); return toast("바꿔 담았어요");
  }
  const act = d.act;
  if (!act) return;
  if (act === "close-sheet") return closeSheet();
  if (act === "dismiss-welcome") { S.welcomed = true; save(); return render(); }
  if (act === "save") {
    const c = RES.combos[Number(d.ci)], sg = sig(c);
    if (S.saved.some((x) => x.sig === sg)) { S.saved = S.saved.filter((x) => x.sig !== sg); toast("저장을 취소했어요"); }
    else { S.saved.unshift(snapshot(c)); toast("저장했어요"); }
    save(); renderResults(); return render();
  }
  if (act === "unsave") { S.saved = S.saved.filter((x) => String(x.at) !== String(d.id)); save(); return render(); }
  if (act === "cart") {
    const c = comboFrom(Number(d.ci), d.sid); if (!c) return;
    c.items.forEach((it) => {
      const ex = S.cart.find((x) => x.id === it.id);
      if (ex) { ex.qty += 1; ex.done = false; }
      else S.cart.push({ id: it.id, name: it.name, price: it.price, type: it.type, cat: it.cat || (BY_ID.get(it.id) || {}).cat, event: it.event, qty: 1, done: false });
    });
    save(); render(); return toast(`장보기에 ${c.items.length}개를 담았어요`);
  }
  if (act === "share") { const c = comboFrom(Number(d.ci), d.sid); if (c) copy(shareText(c.items, c.cost), "조합을 복사했어요. 메신저에 붙여 넣으세요"); return; }
  if (act === "cart-share") return copy("CU 장보기\n" + S.cart.map((x) => `${x.done ? "✓" : "□"} ${x.name}${x.qty > 1 ? " ×" + x.qty : ""} ${won(x.price * x.qty)}원`).join("\n") + `\n합계 ${won(S.cart.reduce((a, x) => a + x.price * x.qty, 0))}원`, "장보기 목록을 복사했어요");
  if (act === "cart-clear") { S.cart = []; save(); return render(); }
  if (act === "use-target") { const pl = plan(); if (!pl.ok) return; Object.assign(S, { R: pl.R, b: pl.b, welcomed: true }); save(); go("find"); return compute(); }
  if (act === "more") return loadMore();
  if (act === "clear-kmax") { S.b = null; render(); return compute(); }
  if (act === "clear-lim") { S.L = {}; refreshSheet(); return compute(); }
  if (act === "clear-excluded") { S.excluded = []; refreshSheet(); return compute(); }
  if (act === "set-cap") { S.cap = Number(d.v); render(); return compute(); }
  if (act === "widen") { S.types = ALL_TYPES.slice(); S.Q = {}; S.L = {}; S.b = null; S.cap = Math.max(S.cap, 15000); render(); return compute(); }
  if (act === "reset") { const keep = { welcomed: true }; S = Object.assign(JSON.parse(JSON.stringify(DEF)), keep); save(); render(); compute(); return toast("설정을 지웠어요"); }
});
function findSnap(id) { for (const s of S.saved) { const it = s.items.find((x) => x.id === id); if (it) return it; } return null; }
function CTX_cand() {
  const ex = new Set(S.excluded), pin = new Set(S.pinned);
  return Algo.usable(ITEMS.filter((it) => S.types.includes(it.type) && !ex.has(it.id) && !pin.has(it.id)), kmax(), CTX.L).filter((it) => it.price <= S.cap);
}
function refreshPin() { const r = $("sheet-root"); if (r.dataset.kind === "pin" && r.innerHTML) { const q = $("pin-q") ? $("pin-q").value : ""; openSheet("pin"); $("pin-q").value = q; pinSearch(q); } else refreshSheet(); }
function syncPresets() { const L = presetList(); document.querySelectorAll("[data-preset]").forEach((b) => { const p = L.find((x) => x.id === b.dataset.preset); b.setAttribute("aria-pressed", String(!!p && p.R === S.R && p.b === S.b)); }); }

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "in-R") {
    const v = el.value.trim() === "" ? NaN : Number(el.value);
    S.R = Number.isFinite(v) ? Math.round(v) : NaN; syncPresets(); return schedule();
  }
  if (el.id === "in-b") { // 비우면 상관없음
    const v = el.value.trim();
    S.b = v === "" ? null : Number.isFinite(Number(v)) ? Math.round(Number(v)) : NaN; syncPresets(); return schedule();
  }
  if (el.id === "in-cap") { S.cap = Number(el.value); $("cap-val").textContent = won(S.cap) + "원"; return schedule(); }
  if (el.dataset.lim) { const v = el.value.trim(); S.L[el.dataset.lim] = v === "" || Number(v) < 0 ? null : Number(v); return schedule(); }
  if (el.id === "pin-q") return pinSearch(el.value);
  // 입력칸은 다시 그리지 않고 계산 결과만 바꿔서, 입력 중인 숫자가 지워지지 않게 한다
  if (el.dataset.pfnum) { const v = el.value.trim(); S.profile[el.dataset.pfnum] = v === "" ? null : Number(v); save(); const o = $("pf-out"); if (o) o.innerHTML = planOut(); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.type) { const t = el.dataset.type; S.types = el.checked ? [...new Set(S.types.concat(t))] : S.types.filter((x) => x !== t); refreshSheet(); return compute(); }
  if (el.dataset.grp != null) { const g = GROUPS[el.dataset.grp]; S.types = el.checked ? [...new Set(S.types.concat(g.types))] : S.types.filter((x) => !g.types.includes(x)); refreshSheet(); return compute(); }
  if (el.dataset.cart) { const x = S.cart.find((c) => c.id === el.dataset.cart); if (x) x.done = el.checked; save(); return render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
// IntersectionObserver가 없거나 안 불릴 때를 위한 스크롤 확인
window.addEventListener("scroll", () => { const s = $("more-sentinel"); if (s && s.getBoundingClientRect().top < innerHeight + 200) loadMore(); }, { passive: true });
document.addEventListener("focusin", (e) => { if (e.target.id === "pin-q" && !$("pin-results").innerHTML) pinSearch(""); });

// ================= 시작 =================
const DATA = window.__ITEMS__ ? Promise.resolve(window.__ITEMS__) : Promise.resolve(window.__DATA__);
DATA.then((d) => {
  META = d.meta;
  ITEMS = d.items.map((x) => ({ id: x[0], name: x[1], price: x[2], p: x[3], k: x[4], pr: x[5], kr: x[6], type: x[7], event: x[8],
    carb: x[9], fat: x[10], sugar: x[11], na: x[12], grade: x[13], cat: x[14],
    g: x[15], promo: x[16], u: x[17] || 1 })); // g: 같은 상품의 행끼리 같은 값, promo: 행사 상품을 적게 사는 행이면 "1+1"/"2+1", u: 받는 개수
  BY_ID = new Map(ITEMS.map((it) => [it.id, it]));
  // 데이터가 바뀌어 없어진 상품은 정리
  S.pinned = S.pinned.filter((id) => BY_ID.has(id)); S.excluded = S.excluded.filter((id) => BY_ID.has(id));
  S.types = S.types.filter((t) => ALL_TYPES.includes(t));
  $("datatag").textContent = `CU ${META.collected} 가격 · 상품 ${won(productCount())}개`;
  render(); compute();
}).catch((e) => {
  $("view").innerHTML = `<div class="card empty"><h3>상품 데이터를 불러오지 못했어요</h3><p class="muted">${esc(e.message)} · 페이지를 새로 고쳐 주세요.</p></div>`;
});
</script>
